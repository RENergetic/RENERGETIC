apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: swagger-ui
  name: swagger-ui
spec:
  selector:
      matchLabels:
        app: swagger-ui
  replicas: 1
  template:
    metadata:
      labels:
        app: swagger-ui
    spec:
      containers:
        - name: swagger-ui
          image: docker-registry.default.svc:5000/ren-prototype-devops/swagger-ui:latest
          imagePullPolicy: Never
          ports:
            - name: api-http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 150Mi
            limits:
              cpu: 150m
              memory: 150Mi
          envFrom:
            - configMapRef:
                name: swagger-config
      restartPolicy: Always